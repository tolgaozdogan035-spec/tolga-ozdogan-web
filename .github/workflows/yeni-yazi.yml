- name: Köşe Yazısı HTML Sayfalarını Oluştur
        run: |
          python generate.py --json_file yeni_yazi.json

      - name: Değişiklikleri Git'e Ekle ve Yayınla
        run: |
          git config --global user.name "Tolga Özdoğan (Otomasyon)"
          git config --global user.email "tolgaozdogan035@gmail.com"
          
          # Tüm yeni ve güncellenen dosyaları (JSON, HTML) stage'e ekle
          git add -A
          
          # Eğer commit edilecek değişiklik varsa commit yap ve push et, yoksa hata verme
          if git diff --staged --quiet; then
            echo "Yayınlanacak yeni bir değişiklik bulunamadı."
          else
            git commit -m "Otomatik Yayın: Yeni köşe yazısı eklendi ($(date +'%d.%m.%Y %H:%M'))"
            git push
          fi
