name: Otomatik Kose Yazisi Yayini

on:
  workflow_dispatch:
  schedule:
    # Pazartesi (1) ve Çarşamba (3) günleri Türkiye saatiyle 10:00 (UTC 07:00)
    - cron: '0 7 * * 1,3'

permissions:
  contents: write

jobs:
  publish-article:
    runs-on: ubuntu-latest

    steps:
      # 1. Depoyu çek
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Python Ortamını Kur
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Gerekli Paketleri Yükle
      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      # 4. TolgaOzdoganWeb Klasöründen En Güncel yeni_yazi.json Dosyasını Otomatik Çek
      - name: Google Drive Klasöründen yeni_yazi.json İndir
        run: |
          python - << 'EOF'
          import os
          import shutil
          import gdown

          folder_id = "1voIqvnSh48gOQQjtAFePkfmMbRZ4d3Lk"
          print("TolgaOzdoganWeb klasöründen dosyalar indiriliyor...")
          
          # Klasördeki tüm içeriği geçici klasöre çek
          gdown.download_folder(id=folder_id, output="gdrive_temp", quiet=False, use_cookies=False)
          
          # İndirilenler arasında yeni_yazi.json dosyasını bul ve ana dizine kopyala
          found = False
          for root, dirs, files in os.walk("gdrive_temp"):
              for f in files:
                  if f == "yeni_yazi.json":
                      src = os.path.join(root, f)
                      shutil.copy(src, "yeni_yazi.json")
                      found = True
                      print(f"Başarıyla bulundu ve güncellendi: {src} -> ./yeni_yazi.json")
                      break
          
          if not found or not os.path.exists("yeni_yazi.json"):
              print("Hata: Klasör içerisinde yeni_yazi.json bulunamadı!")
              exit(1)
          EOF
          ls -lh yeni_yazi.json

      # 5. HTML Sayfalarını Üret ve Listeyi Güncelle
      - name: HTML Sayfalarını Üret ve Listeyi Güncelle
        run: |
          python - << 'EOF'
          import json
          import os
          import sys

          def format_content(raw_content: str, quote: str = "") -> str:
              paragraphs = [p.strip() for p in raw_content.split("\n\n") if p.strip()]
              formatted_html = []
              for i, p in enumerate(paragraphs):
                  if i == 0:
                      formatted_html.append(
                          f'<p class="text-xl md:text-2xl text-white font-serif leading-relaxed italic border-b border-brand-gray/10 pb-6">{p}</p>'
                      )
                  else:
                      formatted_html.append(f'<p>{p}</p>')
                  if i == 2 and quote:
                      formatted_html.append(
                          f'<div class="article-quote">\n    "{quote}"\n</div>'
                      )
              return "\n\n".join(formatted_html)

          def generate_article_page(title: str, slug: str, date_str: str, read_time: str, category: str, content_html: str, tags: list) -> str:
              tags_html = "\n".join([
                  f'<span class="text-xs font-sans bg-brand-card border border-brand-gray/20 text-brand-gray px-3 py-1 rounded-sm">{t}</span>'
                  for t in tags
